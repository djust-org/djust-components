[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "djust-components"
version = "99.0.0"
description = "DEPRECATED: use `pip install djust` instead."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "djust contributors" },
]
dependencies = [
    "djust>=0.5.6rc1",
]

[project.urls]
Homepage = "https://djust.org"
Repository = "https://github.com/djust-org/djust-components"

[tool.hatch.build.targets.wheel]
packages = ["src/djust_components"]
